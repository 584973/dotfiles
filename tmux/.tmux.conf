# ── Prefix & reload ───────────────────────────────────────────────────────────
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# ── Behaviour ─────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000
set -g focus-events on

set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
setw -g mode-keys vi

# ── Terminal ──────────────────────────────────────────────────────────────────
set -as terminal-features ",xterm-256color:RGB"

# ── Panes & windows ───────────────────────────────────────────────────────────
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ── Copy mode ─────────────────────────────────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ── Sessions ──────────────────────────────────────────────────────────────────
# Prefix + C → prompt for session name, root at current pane
bind-key C command-prompt -p "New session name:" \
  "new-session -s '%%' -c '#{pane_current_path}'"

# ── Status bar ────────────────────────────────────────────────────────────────
# native replacement for niksingh710/minimal-tmux-status
set -g status-position top
set -g status-style "bg=default,fg=default"
set -g status-justify absolute-centre
set -g status-left-length 10
set -g status-right-length 40
set -g status-right "#S"
set -g status-left "#[bold]#{?client_prefix, tmux ,}#[default]"
set -g window-status-format " #I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep \"^ssh \" | sed \"s/.* //\"),#W} "
set -g window-status-current-format " #[bold][#I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep \"^ssh \" | sed \"s/.* //\"),#W}#{?window_zoomed_flag,󰊓 ,}]#[default] "

# ── Plugins ───────────────────────────────────────────────────────────────────
# tpm resolves the plugin dir via XDG: ~/.config/tmux/plugins/
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
